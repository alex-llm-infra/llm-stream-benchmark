# Multi-Provider Matrix Benchmark Configuration
defaults:
  requests: 10
  concurrency: 5
  max_tokens: 256
  temperature: 0.2
  slo_ttft_ms: 1000.0
  slo_tpot_ms: 25.0
  prompt: "Explain the architecture of HTTP/2 multiplexing and how it prevents head-of-line blocking at the application layer in 3 concise paragraphs."

targets:
  - name: "OpenAI-Direct-Tier5"
    protocol: "openai"
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    model: "gpt-4o-mini"

  - name: "Anthropic-Native-Direct"
    protocol: "anthropic"
    base_url: "https://api.anthropic.com/v1"
    api_key_env: "ANTHROPIC_API_KEY"
    model: "claude-3-7-sonnet-20250219"

  - name: "Enterprise-Edge-Gateway"
    protocol: "openai"
    base_url: "https://api.openai.com/v1"
    api_key_env: "GATEWAY_API_KEY"
    model: "gpt-4o"
